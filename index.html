<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>I Need A Minute</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3a7d8a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Need A Minute" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="page">
  <header class="intro">
    <h1>I Need A Minute</h1>
    <p class="tagline">Name it. Understand it. Take a minute. Come back.</p>
    <a href="dashboard.html" class="button-link small">Dashboard</a>
  </header>

  <div id="stepIndicator" class="step-indicator" hidden></div>

  <!-- Intake, one question per screen -->
  <section id="feeling" class="stage" hidden>
    <form id="feelingForm" class="single-question">
      <label class="field">
        What are you feeling?
        <input type="text" id="feelingInput" placeholder="e.g. Anxious, angry, overwhelmed…" required />
      </label>
      <button type="submit" class="primary large">Next</button>
    </form>
  </section>

  <section id="bodyLocation" class="stage" hidden>
    <form id="bodyLocationForm" class="single-question">
      <label class="field">
        Where is it felt physically?
        <input type="text" id="bodyLocationInput" placeholder="e.g. Chest, stomach, shoulders…" />
      </label>
      <button type="button" class="link-btn" data-back>Back</button>
      <button type="submit" class="primary large">Next</button>
    </form>
  </section>

  <section id="initialRating" class="stage" hidden>
    <form id="initialRatingForm" class="single-question">
      <label class="field">
        How intense is this feeling? (1–10)
        <div class="rating-row">
          <input type="range" id="initialRatingInput" min="1" max="10" step="1" value="5" />
          <div class="rating-value" id="initialRatingValue">5</div>
        </div>
      </label>
      <button type="button" class="link-btn" data-back>Back</button>
      <button type="submit" class="primary large">Next</button>
    </form>
  </section>

  <section id="timeframe" class="stage" hidden>
    <form id="timeframeForm" class="single-question">
      <fieldset class="field timeframe-field">
        <legend>Is this problem happening in the...</legend>
        <div class="choice-grid" id="timeframeChoices">
          <label class="choice"><input type="radio" name="timeframe" value="past" /> Past</label>
          <label class="choice"><input type="radio" name="timeframe" value="present" /> Right now</label>
          <label class="choice"><input type="radio" name="timeframe" value="future" /> Future</label>
          <label class="choice"><input type="radio" name="timeframe" value="doesnt-exist" /> It doesn't really exist</label>
        </div>
      </fieldset>
      <button type="button" class="link-btn" data-back>Back</button>
      <button type="submit" class="primary large">Next</button>
    </form>
  </section>

  <section id="plan" class="stage" hidden>
    <form id="planForm" class="single-question">
      <label class="field">
        What will you do to regulate?
        <textarea id="planInput" rows="3" placeholder="e.g. Breathe slowly, step outside, drink some water…"></textarea>
      </label>
      <button type="button" class="link-btn" data-back>Back</button>
      <button type="submit" class="primary large">Next</button>
    </form>
  </section>

  <!-- Time needed, directly before the timer (no summary shown yet) -->
  <section id="timerSetup" class="stage" hidden>
    <h2>Time needed</h2>
    <div class="timer-setup">
      <label class="field">
        Minutes
        <input type="number" id="minutesInput" min="1" max="180" step="1" value="5" />
      </label>
      <div class="quick-picks" id="quickPicks">
        <button type="button" data-minutes="2">2</button>
        <button type="button" data-minutes="5">5</button>
        <button type="button" data-minutes="10">10</button>
        <button type="button" data-minutes="15">15</button>
      </div>
    </div>
    <button type="button" class="link-btn" data-back>Back</button>
    <button type="button" id="goBtn" class="primary large">Go</button>
  </section>

  <!-- Timer -->
  <section id="timer" class="stage" hidden>
    <h2>Take your minute</h2>
    <p class="timer-hint">Breathe. Step away if you can. Come back when the timer ends.</p>
    <div class="countdown" id="countdownDisplay">--:--</div>
    <button type="button" id="skipTimerBtn" class="link-btn">I'm ready now</button>
  </section>

  <!-- Revisit, one question per screen -->
  <section id="finalRating" class="stage" hidden>
    <h2>Welcome back</h2>
    <form id="finalRatingForm" class="single-question">
      <label class="field">
        How intense is the feeling now? (1–10)
        <div class="rating-row">
          <input type="range" id="finalRatingInput" min="1" max="10" step="1" value="5" />
          <div class="rating-value" id="finalRatingValue">5</div>
        </div>
      </label>
      <button type="submit" class="primary large">Next</button>
    </form>
  </section>

  <section id="cause" class="stage" hidden>
    <form id="causeForm" class="single-question">
      <label class="field">
        What's causing it?
        <input type="text" id="causeInput" placeholder="What's behind this feeling?" />
      </label>
      <button type="button" class="link-btn" data-back>Back</button>
      <button type="submit" class="primary large">Next</button>
    </form>
  </section>

  <section id="revisitResolution" class="stage" hidden>
    <div class="single-question">
      <fieldset class="field">
        <legend>Was there a resolution?</legend>
        <div class="choice-grid three" id="resolutionChoices">
          <button type="button" class="choice-btn" data-value="yes">Yes</button>
          <button type="button" class="choice-btn" data-value="no">No</button>
          <button type="button" class="choice-btn" data-value="somewhat">Somewhat</button>
        </div>
      </fieldset>
      <button type="button" class="link-btn" data-back>Back</button>
      <button type="button" id="resolutionNextBtn" class="primary large">Next</button>
    </div>
  </section>

  <section id="revisitNotes" class="stage" hidden>
    <form id="revisitNotesForm" class="single-question">
      <label class="field">
        Notes
        <textarea id="revisitNotesInput" rows="3" placeholder="Anything else worth remembering…"></textarea>
      </label>
      <button type="button" class="link-btn" data-back>Back</button>
      <button type="submit" class="primary large">Submit</button>
    </form>
  </section>

  <!-- Final summary, first person -->
  <section id="resolved" class="stage" hidden>
    <h2>How it went</h2>
    <div class="summary-card" id="resolvedSummary"></div>

    <div class="actions-buttons">
      <button type="button" id="saveArchiveBtn" class="primary">Save to Dashboard</button>
      <button type="button" id="resetBtn" class="danger">Reset</button>
    </div>
  </section>

  <audio id="chime" preload="auto" src="audio/chime.wav"></audio>
</main>

<script src="app.js"></script>
</body>
</html>
