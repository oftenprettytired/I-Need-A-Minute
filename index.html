<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>I Need A Minute</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3a7d8a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Need A Minute" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="page">
  <header class="intro">
    <h1>I Need A Minute</h1>
    <p class="tagline">Name it. Understand it. Take a minute. Come back.</p>
    <a href="archive.html" class="button-link small">Archive</a>
  </header>

  <!-- Stage 1: Intake -->
  <section id="intake" class="stage" hidden>
    <form id="intakeForm">
      <label class="field">
        What are you feeling?
        <input type="text" id="feeling" placeholder="e.g. Anxious, angry, overwhelmed…" required />
      </label>

      <label class="field">
        What's causing it?
        <input type="text" id="cause" placeholder="What's behind this feeling?" />
      </label>

      <label class="field">
        What does this make you want to do? (your first reaction)
        <input type="text" id="reaction" placeholder="e.g. Snap back, walk away, shut down…" />
      </label>

      <fieldset class="field timeframe-field">
        <legend>Is this problem happening in the...</legend>
        <div class="choice-grid" id="timeframeChoices">
          <label class="choice"><input type="radio" name="timeframe" value="past" /> Past</label>
          <label class="choice"><input type="radio" name="timeframe" value="present" /> Right now</label>
          <label class="choice"><input type="radio" name="timeframe" value="future" /> Future</label>
          <label class="choice"><input type="radio" name="timeframe" value="doesnt-exist" /> It doesn't really exist</label>
        </div>
      </fieldset>

      <label class="field">
        How will you calm yourself and regulate this feeling?
        <textarea id="plan" rows="3" placeholder="e.g. Breathe slowly, step outside, drink some water…"></textarea>
      </label>

      <button type="submit" class="primary large">Submit</button>
    </form>
  </section>

  <!-- Stage 2: Summary + timer setup -->
  <section id="summary" class="stage" hidden>
    <h2>Here's what you shared</h2>
    <div class="summary-card" id="summaryText"></div>

    <button type="button" id="editIntakeBtn" class="link-btn">Edit my answers</button>

    <div class="timer-setup">
      <label class="field">
        Time needed
        <input type="number" id="minutesInput" min="1" max="180" step="1" value="5" />
        <span class="hint">minutes</span>
      </label>
      <div class="quick-picks" id="quickPicks">
        <button type="button" data-minutes="2">2</button>
        <button type="button" data-minutes="5">5</button>
        <button type="button" data-minutes="10">10</button>
        <button type="button" data-minutes="15">15</button>
      </div>
      <button type="button" id="goBtn" class="primary large">Go</button>
    </div>
  </section>

  <!-- Stage 3: Timer -->
  <section id="timer" class="stage" hidden>
    <h2>Take your minute</h2>
    <p class="timer-hint">Breathe. Step away if you can. Come back when the timer ends.</p>
    <div class="countdown" id="countdownDisplay">--:--</div>
    <button type="button" id="skipTimerBtn" class="link-btn">I'm ready now</button>
  </section>

  <!-- Stage 4: Revisit -->
  <section id="revisit" class="stage" hidden>
    <h2>Welcome back</h2>
    <form id="revisitForm">
      <label class="field">
        What are you feeling now?
        <input type="text" id="revisitFeeling" placeholder="How do you feel now?" required />
      </label>

      <fieldset class="field">
        <legend>Was there a resolution?</legend>
        <div class="choice-grid three" id="resolutionChoices">
          <button type="button" class="choice-btn" data-value="yes">Yes</button>
          <button type="button" class="choice-btn" data-value="no">No</button>
          <button type="button" class="choice-btn" data-value="somewhat">Somewhat</button>
        </div>
      </fieldset>

      <label class="field">
        Notes
        <textarea id="revisitNotes" rows="3" placeholder="Anything else worth remembering…"></textarea>
      </label>

      <button type="submit" class="primary large">Submit</button>
    </form>
  </section>

  <!-- Stage 5: Resolution summary -->
  <section id="resolved" class="stage" hidden>
    <h2>How it went</h2>
    <div class="summary-card" id="resolvedSummary"></div>

    <div class="actions-buttons">
      <button type="button" id="saveArchiveBtn" class="primary">Save to Archive</button>
      <button type="button" id="resetBtn" class="danger">Reset</button>
    </div>
  </section>

  <audio id="chime" preload="auto" src="audio/chime.wav"></audio>
</main>

<script src="app.js"></script>
</body>
</html>
